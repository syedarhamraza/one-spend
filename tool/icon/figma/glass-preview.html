<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1e1e1e;display:flex;gap:40px;padding:40px;font-family:Inter,Segoe UI,sans-serif;color:#ccc}
.c{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:20px}
.tile{position:relative;width:400px;height:400px;border-radius:120px;overflow:hidden}
.tile>img{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.12));
 border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.pill{position:absolute;left:30px;bottom:30px;width:80px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45)}
.small{width:96px;height:96px;border-radius:30px}
</style></head><body>
<script>
const bgs=[['bg-deep-blue.svg','Deep blue + glow'],['bg-oled.svg','OLED + glows (app style)'],['bg-vivid.svg','Vivid blue to indigo'],['background.svg','Current bright blue']];
const stack=(s)=>`<div class="card" style="left:${110*s}px;top:${66*s}px;width:${180*s}px;height:${120*s}px"></div>
<div class="card" style="left:${98*s}px;top:${100*s}px;width:${204*s}px;height:${130*s}px"></div>
<div class="card" style="left:${85*s}px;top:${140*s}px;width:${230*s}px;height:${155*s}px"><div class="pill" style="transform:scale(${s});transform-origin:left bottom"></div></div>`;
document.body.innerHTML=bgs.map(([f,n])=>`<div class="c"><div class="tile"><img src="${f}">${stack(1)}</div>
<div style="display:flex;gap:16px;align-items:center"><div class="tile small"><img src="${f}">${stack(.24)}</div></div>${n}</div>`).join('');
</script></body></html>
