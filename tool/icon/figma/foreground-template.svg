<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Guides for drawing the One Spend icon foreground (hide or delete them before export).
       Android shows the middle 683 px (72 of 108 units) under the launcher's mask, and only
       the central 626 px circle (66 units) is guaranteed visible on every launcher shape. -->
  <rect id="Background (reference only)" width="1024" height="1024" fill="#2F7DF0"/>
  <rect id="Visible area 683 (guide)" x="170.5" y="170.5" width="683" height="683" rx="200" fill="none" stroke="#FFD60A" stroke-width="3" stroke-dasharray="14 10"/>
  <circle id="Safe zone 626 (guide) - keep the mark inside" cx="512" cy="512" r="313" fill="none" stroke="#FF453A" stroke-width="4"/>
  <circle id="Comfortable size 480 (guide)" cx="512" cy="512" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="8 8"/>
  <line id="Centre V (guide)" x1="512" y1="0" x2="512" y2="1024" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  <line id="Centre H (guide)" x1="0" y1="512" x2="1024" y2="512" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
</svg>
