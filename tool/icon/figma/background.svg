<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- One Spend adaptive icon background: One UI blue gradient + a soft top-left sheen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BA2FF"/>
      <stop offset="1" stop-color="#0060E6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="307" cy="205" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect id="Gradient" width="1024" height="1024" fill="url(#bg)"/>
  <rect id="Sheen" width="1024" height="1024" fill="url(#sheen)"/>
</svg>
